    /* ============================================================
       FONT VARIABLE DEFINITIONS
    ============================================================ */
    [data-font="sans"]     { --font-kanji: 'Noto Sans JP', sans-serif; --font-ui: 'Noto Sans JP', sans-serif; }
    [data-font="serif"]    { --font-kanji: 'Noto Serif JP', serif; --font-ui: 'Noto Sans JP', sans-serif; }
    [data-font="rounded"]  { --font-kanji: 'Zen Maru Gothic', sans-serif; --font-ui: 'Zen Maru Gothic', sans-serif; }
    [data-font="klee"]     { --font-kanji: 'Klee One', cursive; --font-ui: 'Klee One', cursive; }
    [data-font="shippori"] { --font-kanji: 'Shippori Mincho', serif; --font-ui: 'Noto Sans JP', sans-serif; }
    [data-font="kaisei"]   { --font-kanji: 'Kaisei Opti', serif; --font-ui: 'Noto Sans JP', sans-serif; }

    /* ============================================================
       GLOBAL RESET & BASE
    ============================================================ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      font-family: var(--font-ui, 'Noto Sans JP', sans-serif);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      transition: background 0.25s, color 0.25s;
      line-height: 1.6;
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 3px; }

    /* ============================================================
       HEADER
    ============================================================ */
    header {
      background: var(--header-bg);
      border-bottom: 1px solid var(--header-border);
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 54px;
      position: sticky;
      top: 0;
      z-index: 100;
      transition: background 0.25s;
    }

    .header-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    .logo-kanji {
      font-family: var(--font-kanji, 'Noto Sans JP', sans-serif);
      font-size: 1.6em;
      color: var(--accent);
      line-height: 1;
    }

    .logo-text {
      font-size: 1em;
      font-weight: 700;
      color: var(--header-logo-text);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .header-actions { display: flex; align-items: center; gap: 8px; }

    .icon-btn {
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.14);
      color: rgba(255,255,255,0.7);
      width: 34px;
      height: 34px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1em;
      transition: all 0.2s;
    }
    .icon-btn:hover { background: rgba(255,255,255,0.14); color: #fff; }

    /* ============================================================
       INFO BOX
    ============================================================ */
    #info-box-area .info-box {
      padding: 8px 20px;
      background: var(--badge-bg);
      border-bottom: 1px solid var(--border);
      color: var(--badge-text);
      font-size: 0.82em;
      text-align: center;
    }
    #info-box-area .info-box.error-message {
      background: rgba(248,81,73,0.1);
      color: #f85149;
    }

    /* ============================================================
       FILTER BAR
    ============================================================ */
    .filters {
      display: flex;
      gap: 6px;
      padding: 10px 16px;
      background: var(--bg-alt);
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
      align-items: center;
      transition: background 0.25s;
    }

    .filters button {
      padding: 5px 13px;
      border: 1px solid var(--btn-border);
      border-radius: 20px;
      background: var(--btn-bg);
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.8em;
      font-weight: 500;
      font-family: inherit;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .filters button:hover:not(:disabled) { color: var(--text); border-color: var(--accent); }
    .filters button.active {
      background: var(--btn-active-bg);
      color: var(--btn-active-text);
      border-color: var(--btn-active-bg);
    }
    .filters button:disabled { opacity: 0.4; cursor: not-allowed; }

    /* JLPT level tint on filter buttons */
    .filters button[data-level="jlpt_n5"]:not(.active) { border-left: 3px solid var(--tag-n5); }
    .filters button[data-level="jlpt_n4"]:not(.active) { border-left: 3px solid var(--tag-n4); }
    .filters button[data-level="jlpt_n3"]:not(.active) { border-left: 3px solid var(--tag-n3); }
    .filters button[data-level="jlpt_n2"]:not(.active) { border-left: 3px solid var(--tag-n2); }
    .filters button[data-level="jlpt_n1"]:not(.active) { border-left: 3px solid var(--tag-n1); }

    /* ============================================================
       STATUS BAR
    ============================================================ */
    .status-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 16px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
      transition: background 0.25s;
    }

    #jlpt-counts {
      font-size: 0.76em;
      color: var(--text-muted);
      flex: 1;
      min-width: 180px;
    }
    #jlpt-counts #learned-count { color: var(--learned-text); font-weight: 700; }

    .search-wrapper { position: relative; display: flex; align-items: center; }
    .search-icon {
      position: absolute;
      left: 10px;
      color: var(--text-muted);
      font-size: 0.82em;
      pointer-events: none;
    }

    #search-input {
      padding: 6px 12px 6px 30px;
      border: 1px solid var(--input-border);
      border-radius: 20px;
      background: var(--input-bg);
      color: var(--text);
      font-size: 0.85em;
      font-family: inherit;
      width: 220px;
      transition: all 0.2s;
      outline: none;
    }
    #search-input::placeholder { color: var(--text-faint); }
    #search-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--badge-bg); }

    #current-view-count { font-size: 0.76em; color: var(--text-muted); white-space: nowrap; }

    /* ============================================================
       KANJI GRID
    ============================================================ */
    .kanji-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 14px;
      padding: 18px;
      min-height: 300px;
    }

    /* ============================================================
       KANJI CARD
    ============================================================ */
    .kanji-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, box-shadow 0.2s, background 0.25s, border-color 0.2s;
      position: relative;
      overflow: hidden;
      box-shadow: var(--shadow);
      animation: cardIn 0.22s ease both;
    }
    .kanji-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% 0%, var(--card-glow), transparent 70%);
      pointer-events: none;
    }
    .kanji-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow), 0 0 0 1px var(--accent);
      background: var(--bg-card-hover);
    }
    .kanji-card.is-learned-card { border-color: var(--learned-border); }

    /* JLPT top accent stripe */
    .kanji-card[data-jlpt="5"] { border-top: 2px solid var(--tag-n5); }
    .kanji-card[data-jlpt="4"] { border-top: 2px solid var(--tag-n4); }
    .kanji-card[data-jlpt="3"] { border-top: 2px solid var(--tag-n3); }
    .kanji-card[data-jlpt="2"] { border-top: 2px solid var(--tag-n2); }
    .kanji-card[data-jlpt="1"] { border-top: 2px solid var(--tag-n1); }

    /* KANJI CHARACTER */
    .kanji-char {
      font-family: var(--font-kanji, 'Noto Sans JP', sans-serif);
      font-size: 3.8em;
      text-align: center;
      margin-bottom: 10px;
      position: relative;
      line-height: 1;
      padding: 8px 0;
      color: var(--text);
    }

    .speech-button {
      position: absolute;
      top: 0;
      right: 0;
      background: none;
      border: none;
      font-size: 0.72em;
      cursor: pointer;
      color: var(--text-muted);
      padding: 4px;
      line-height: 1;
      transition: color 0.2s, transform 0.15s;
      border-radius: 4px;
    }
    .speech-button:hover:not(:disabled) { color: var(--accent); transform: scale(1.2); }
    .speech-button:disabled { color: var(--text-faint); cursor: not-allowed; }

    /* BADGES */
    .card-badges {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
    .badge {
      font-size: 0.68em;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 10px;
      background: var(--badge-bg);
      color: var(--badge-text);
      letter-spacing: 0.03em;
    }
    .badge.jlpt-n5 { background: rgba(45,164,78,0.15); color: var(--tag-n5); }
    .badge.jlpt-n4 { background: rgba(31,111,235,0.15); color: var(--tag-n4); }
    .badge.jlpt-n3 { background: rgba(210,153,34,0.15); color: var(--tag-n3); }
    .badge.jlpt-n2 { background: rgba(137,87,229,0.15); color: var(--tag-n2); }
    .badge.jlpt-n1 { background: rgba(248,81,73,0.15); color: var(--tag-n1); }

    /* DETAILS */
    .kanji-details {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-bottom: 12px;
    }
    .detail-row {
      display: flex;
      align-items: baseline;
      gap: 7px;
      font-size: 0.82em;
      line-height: 1.45;
    }
    .field-label {
      font-weight: 600;
      color: var(--text-muted);
      font-size: 0.74em;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      white-space: nowrap;
      min-width: 44px;
    }
    .field-value { color: var(--text); word-break: break-word; }
    .romaji { color: var(--text-muted); font-size: 0.88em; font-style: italic; }

    /* LEARNED BUTTON */
    .learned-btn {
      width: 100%;
      padding: 7px;
      border: 1px solid var(--btn-border);
      border-radius: 8px;
      background: var(--btn-bg);
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.78em;
      font-weight: 500;
      font-family: inherit;
      transition: all 0.2s;
    }
    .learned-btn:hover:not(:disabled) { border-color: var(--learned-border); color: var(--learned-text); }
    .learned-btn.is-learned {
      background: var(--learned-bg);
      color: var(--learned-text);
      border-color: var(--learned-border);
    }

    /* ============================================================
       LOADER / EMPTY STATE
    ============================================================ */
    .loader {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      font-size: 0.95em;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }
    .loader-kanji {
      font-family: var(--font-kanji, 'Noto Sans JP', sans-serif);
      font-size: 3em;
      color: var(--text-faint);
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:0.35} 50%{opacity:1} }
    .error-message { color: #f85149 !important; }

    /* ============================================================
       PAGINATION
    ============================================================ */
    #pagination-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 20px;
    }
    #pagination-controls button {
      padding: 7px 18px;
      background: var(--btn-bg);
      border: 1px solid var(--btn-border);
      border-radius: 8px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.85em;
      cursor: pointer;
      transition: all 0.2s;

      color: var(--btn-active-text);
      border-color: var(--btn-active-bg);
    }

    /* ============================================================

    ============================================================ */

      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
      backdrop-filter: blur(2px);
    }

    .settings-panel {
      position: fixed;

      overflow-y: auto;
    }
    .settings-panel.open { transform: translateX(0); }

    .settings-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;

    /* Font options */

       ANIMATIONS

    }

      .kanji-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

  <script>
  /* ============================================================
     THEME & FONT SYSTEM
     Fully isolated from the app logic below.
  ============================================================ */
  const FONT_URLS = {
    sans:     'https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap',
    serif:    'https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&family=Noto+Sans+JP:wght@400;500;700&display=swap',
    rounded:  'https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700&display=swap',
    klee:     'https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&display=swap',
    shippori: 'https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;700&family=Noto+Sans+JP:wght@400;500;700&display=swap',
    kaisei:   'https://fonts.googleapis.com/css2?family=Kaisei+Opti:wght@400;700&family=Noto+Sans+JP:wght@400;500;700&display=swap',
  };

  const _loadedFonts = new Set();

  function loadFont(fontKey) {
    if (_loadedFonts.has(fontKey) || !FONT_URLS[fontKey]) return;
    const link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = FONT_URLS[fontKey];
    document.head.appendChild(link);
    _loadedFonts.add(fontKey);
  }

  function setTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem('kv-theme', theme);
    document.querySelectorAll('.theme-btn').forEach(btn =>
      btn.classList.toggle('active', btn.dataset.theme === theme)
    );
  }

  function setFont(font) {
    document.documentElement.setAttribute('data-font', font);
    localStorage.setItem('kv-font', font);
    loadFont(font);
    document.querySelectorAll('.font-btn').forEach(btn =>
      btn.classList.toggle('active', btn.dataset.font === font)
    );
  }

  // Apply saved prefs immediately (before DOMContentLoaded) to avoid FOUC
  setTheme(localStorage.getItem('kv-theme') || 'night');
  setFont(localStorage.getItem('kv-font') || 'sans');
  loadFont('sans'); // always preload the base font

  document.querySelectorAll('.theme-btn').forEach(btn =>
    btn.addEventListener('click', () => setTheme(btn.dataset.theme))
  );
  document.querySelectorAll('.font-btn').forEach(btn =>
    btn.addEventListener('click', () => setFont(btn.dataset.font))
  );

  // Settings panel open/close
  const _settingsPanel   = document.getElementById('settings-panel');
  const _settingsOverlay = document.getElementById('settings-overlay');
  document.getElementById('settings-btn').addEventListener('click', () => {
    _settingsPanel.classList.add('open');
    _settingsOverlay.classList.add('open');
  });
  const _closeSettings = () => {
    _settingsPanel.classList.remove('open');
    _settingsOverlay.classList.remove('open');
  };
  document.getElementById('settings-close').addEventListener('click', _closeSettings);
  _settingsOverlay.addEventListener('click', _closeSettings);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') _closeSettings(); });

  /* ============================================================
     APPLICATION LOGIC — unchanged from original
  ============================================================ */
  let allKanjiData = {};
  let currentKanjiData = {};
  let learnedKanji = JSON.parse(localStorage.getItem("learnedKanji")) || [];
  let currentFilter = "all";
  let currentPage = 1;
  const itemsPerPage = 50;

  const kanjiListContainer   = document.getElementById("kanji-list");
  const jlptCountsEl         = document.getElementById("jlpt-counts");
  const currentViewCountEl   = document.getElementById("current-view-count");
  const paginationControlsEl = document.getElementById("pagination-controls");
  const filterButtons        = document.querySelectorAll('.filters button[data-level]');
  const infoBoxArea          = document.getElementById("info-box-area");
  const searchInput          = document.getElementById("search-input");

  let synthesizer   = null;
  let japaneseVoice = null;

  /* ---- Romaji conversion (preserved exactly) ---- */
  function toRomaji(japaneseText) {
    if (!japaneseText) return '';
    let romaji = japaneseText;
    romaji = romaji.replace(/あ/g,'a').replace(/い/g,'i').replace(/う/g,'u').replace(/え/g,'e').replace(/お/g,'o');
    romaji = romaji.replace(/か/g,'ka').replace(/き/g,'ki').replace(/く/g,'ku').replace(/け/g,'ke').replace(/こ/g,'ko');
    romaji = romaji.replace(/さ/g,'sa').replace(/し/g,'shi').replace(/す/g,'su').replace(/せ/g,'se').replace(/そ/g,'so');
    romaji = romaji.replace(/た/g,'ta').replace(/ち/g,'chi').replace(/つ/g,'tsu').replace(/て/g,'te').replace(/と/g,'to');
    romaji = romaji.replace(/な/g,'na').replace(/に/g,'ni').replace(/ぬ/g,'nu').replace(/ね/g,'ne').replace(/の/g,'no');
    romaji = romaji.replace(/は/g,'ha').replace(/ひ/g,'hi').replace(/ふ/g,'fu').replace(/へ/g,'he').replace(/ほ/g,'ho');
    romaji = romaji.replace(/ま/g,'ma').replace(/み/g,'mi').replace(/む/g,'mu').replace(/め/g,'me').replace(/も/g,'mo');
    romaji = romaji.replace(/や/g,'ya').replace(/ゆ/g,'yu').replace(/よ/g,'yo');
    romaji = romaji.replace(/ら/g,'ra').replace(/り/g,'ri').replace(/る/g,'ru').replace(/れ/g,'re').replace(/ろ/g,'ro');
    romaji = romaji.replace(/わ/g,'wa').replace(/を/g,'wo').replace(/ん/g,'n');
    romaji = romaji.replace(/が/g,'ga').replace(/ぎ/g,'gi').replace(/ぐ/g,'gu').replace(/げ/g,'ge').replace(/ご/g,'go');
    romaji = romaji.replace(/ざ/g,'za').replace(/じ/g,'ji').replace(/ず/g,'zu').replace(/ぜ/g,'ze').replace(/ぞ/g,'zo');
    romaji = romaji.replace(/だ/g,'da').replace(/ぢ/g,'ji').replace(/づ/g,'zu').replace(/で/g,'de').replace(/ど/g,'do');
    romaji = romaji.replace(/ば/g,'ba').replace(/び/g,'bi').replace(/ぶ/g,'bu').replace(/べ/g,'be').replace(/ぼ/g,'bo');
    romaji = romaji.replace(/ぱ/g,'pa').replace(/ぴ/g,'pi').replace(/ぷ/g,'pu').replace(/ぺ/g,'pe').replace(/ぽ/g,'po');
    romaji = romaji.replace(/ゃ/g,'ya').replace(/ゅ/g,'yu').replace(/ょ/g,'yo');
    romaji = romaji.replace(/っか/g,'kka').replace(/っき/g,'kki').replace(/っく/g,'kku').replace(/っけ/g,'kke').replace(/っこ/g,'kko');
    romaji = romaji.replace(/っさ/g,'ssa').replace(/っし/g,'sshi').replace(/っす/g,'ssu').replace(/っせ/g,'sse').replace(/っそ/g,'sso');
    romaji = romaji.replace(/った/g,'tta').replace(/っち/g,'tchi').replace(/っつ/g,'ttsu').replace(/って/g,'tte').replace(/っと/g,'tto');
    romaji = romaji.replace(/ア/g,'a').replace(/イ/g,'i').replace(/ウ/g,'u').replace(/エ/g,'e').replace(/オ/g,'o');
    romaji = romaji.replace(/カ/g,'ka').replace(/キ/g,'ki').replace(/ク/g,'ku').replace(/ケ/g,'ke').replace(/コ/g,'ko');
    romaji = romaji.replace(/サ/g,'sa').replace(/シ/g,'shi').replace(/ス/g,'su').replace(/セ/g,'se').replace(/ソ/g,'so');
    romaji = romaji.replace(/タ/g,'ta').replace(/チ/g,'chi').replace(/ツ/g,'tsu').replace(/テ/g,'te').replace(/ト/g,'to');
    romaji = romaji.replace(/ナ/g,'na').replace(/ニ/g,'ni').replace(/ヌ/g,'nu').replace(/ネ/g,'ne').replace(/ノ/g,'no');
    romaji = romaji.replace(/ハ/g,'ha').replace(/ヒ/g,'hi').replace(/フ/g,'fu').replace(/ヘ/g,'he').replace(/ホ/g,'ho');
    romaji = romaji.replace(/マ/g,'ma').replace(/ミ/g,'mi').replace(/ム/g,'mu').replace(/メ/g,'me').replace(/モ/g,'mo');
    romaji = romaji.replace(/ヤ/g,'ya').replace(/ユ/g,'yu').replace(/ヨ/g,'yo');
    romaji = romaji.replace(/ラ/g,'ra').replace(/リ/g,'ri').replace(/ル/g,'ru').replace(/レ/g,'re').replace(/ロ/g,'ro');
    romaji = romaji.replace(/ワ/g,'wa').replace(/ヲ/g,'wo').replace(/ン/g,'n');
    romaji = romaji.replace(/aa/g,'ā').replace(/ii/g,'ī').replace(/uu/g,'ū').replace(/ee/g,'ē').replace(/oo/g,'ō');
    romaji = romaji.replace(/ou/g,'ō');
    return romaji;
  }

  /* ---- Voice support (preserved exactly) ---- */
  function checkVoiceSupport() {
    if ('speechSynthesis' in window) {
      synthesizer = window.speechSynthesis;
      const setVoice = () => {
        japaneseVoice = synthesizer.getVoices().find(v => v.lang === 'ja-JP');
        document.querySelectorAll('.speech-button').forEach(btn =>
          btn.disabled = !japaneseVoice
        );
      };
      if (synthesizer.getVoices().length) setVoice();
      else synthesizer.onvoiceschanged = setVoice;
    } else {
      document.querySelectorAll('.speech-button').forEach(btn => btn.disabled = true);
    }
  }

  /* ---- JSON fetcher (preserved exactly) ---- */
  async function fetchJsonFile(filePath, isCritical = false) {
    try {
      const response = await fetch(filePath);
      if (!response.ok) {
        let errorDetail = `HTTP error! Status: ${response.status} for ${filePath}.`;
        if (response.status === 0 || response.type === 'opaque' || response.type === 'error') {
          errorDetail = `Failed to fetch '${filePath}'. Please serve via a local web server (CORS restriction).`;
        }
        throw new Error(errorDetail);
      }
      return await response.json();
    } catch (error) {
      console.error("Error fetching JSON:", error.message);
      if (isCritical) {
        infoBoxArea.innerHTML = `<div class="info-box error-message"><b>Critical Setup Error:</b> ${error.message}</div>`;
        kanjiListContainer.innerHTML = `<div class="loader"><div class="loader-kanji" style="animation:none">⚠</div><span class="error-message">${error.message}</span></div>`;
      } else if (filePath === `data/${currentFilter}.json`) {
        kanjiListContainer.innerHTML = `<div class="loader"><span class="error-message">Failed to load: ${filePath}</span></div>`;
      }
      return {};
    }
  }

  /* ---- Data fetch by level (preserved exactly) ---- */
  async function fetchKanjiDataForLevel(level) {
    if (level === "learned") {
      if (!allKanjiData || Object.keys(allKanjiData).length === 0)
        console.warn("'allKanjiData' is empty for 'learned' filter.");
      return allKanjiData;
    }
    return await fetchJsonFile(`data/${level}.json`);
  }

  /* ---- Load & display (preserved exactly) ---- */
  async function loadAndDisplayKanji(level) {
    currentFilter = level;
    currentPage = 1;
    kanjiListContainer.innerHTML = `<div class="loader"><div class="loader-kanji">漢</div><div>Loading ${level.replace(/_/g,' ').toUpperCase()}…</div></div>`;
    paginationControlsEl.innerHTML = '';
    filterButtons.forEach(btn => btn.classList.toggle('active', btn.dataset.level === level));

    const learnedButton = document.querySelector('button[data-level="learned"]');
    if (level === "learned" && (!allKanjiData || Object.keys(allKanjiData).length === 0)) {
      kanjiListContainer.innerHTML = `<div class="loader"><span class="error-message">'Learned' filter requires data/all_kanji.json which failed to load.</span></div>`;
      currentViewCountEl.textContent = "Displaying: 0 Kanji";
      if (learnedButton) learnedButton.disabled = true;
      updateJLPTCounts();
      return;
    }
    if (learnedButton && allKanjiData && Object.keys(allKanjiData).length > 0)
      learnedButton.disabled = false;

    currentKanjiData = await fetchKanjiDataForLevel(level);
    updateJLPTCounts();
    renderKanji();
  }

  /* ---- Main render (logic preserved; card HTML upgraded) ---- */
  function renderKanji() {
    const fragment    = document.createDocumentFragment();
    let itemsToDisplay = [];
    const sourceData   = (currentFilter === "learned") ? allKanjiData : currentKanjiData;
    const searchQuery  = searchInput.value.toLowerCase().trim();

    if (!sourceData || Object.keys(sourceData).length === 0) {
      if (!kanjiListContainer.querySelector('.error-message')) {
        kanjiListContainer.innerHTML = `<div class="loader"><div class="loader-kanji">空</div><div>No Kanji data found for "${currentFilter}".</div></div>`;
      }
      currentViewCountEl.textContent = "Displaying: 0 Kanji";
      paginationControlsEl.innerHTML = '';
      return;
    }

    itemsToDisplay = (currentFilter === "learned")
      ? Object.entries(sourceData).filter(([char]) => learnedKanji.includes(char))
      : Object.entries(sourceData);

    // Enhanced search (preserved exactly)
    if (searchQuery) {
      itemsToDisplay = itemsToDisplay.filter(([char, info]) => {
        const meanings         = (info.meanings      || []).join(' ').toLowerCase();
        const readings_on      = (info.readings_on   || []).join(' ').toLowerCase();
        const readings_kun     = (info.readings_kun  || []).join(' ').toLowerCase();
        const on_romaji        = toRomaji(readings_on);
        const kun_romaji       = toRomaji(readings_kun);
        return char.includes(searchQuery)     ||
               meanings.includes(searchQuery) ||
               readings_on.includes(searchQuery)  ||
               readings_kun.includes(searchQuery) ||
               on_romaji.includes(searchQuery)    ||
               kun_romaji.includes(searchQuery);
      });
    }

    if (itemsToDisplay.length === 0) {
      kanjiListContainer.innerHTML = `<div class="loader"><div class="loader-kanji">見</div><div>No Kanji match "${searchQuery || currentFilter}".</div></div>`;
      currentViewCountEl.textContent = "Displaying: 0 Kanji";
      paginationControlsEl.innerHTML = '';
      return;
    }

    const total      = itemsToDisplay.length;
    const startIndex = (currentPage - 1) * itemsPerPage;
    const paginated  = itemsToDisplay.slice(startIndex, startIndex + itemsPerPage);

    currentViewCountEl.textContent = `Showing ${paginated.length} of ${total} (Page ${currentPage})`;

    paginated.forEach(([char, info], idx) => {
      const card = document.createElement("div");
      card.className = "kanji-card";
      card.dataset.char = char;
      card.style.animationDelay = `${Math.min(idx * 14, 280)}ms`;

      const isLearned    = learnedKanji.includes(char);
      if (isLearned) card.classList.add('is-learned-card');

      const meanings     = info && info.meanings    ? info.meanings.join(', ')    : 'N/A';
      const readings_on  = info && info.readings_on ? info.readings_on.join(', ') : 'N/A';
      const readings_kun = info && info.readings_kun? info.readings_kun.join(', '): 'N/A';
      const strokes      = (info && info.strokes) || 'N/A';
      const grade        = (info && info.grade)   || 'N/A';
      const jlptLevel    = info && (info.jlpt_new || info.jlpt_old);
      const jlptDisplay  = jlptLevel ? `N${jlptLevel}` : 'N/A';

      if (jlptLevel) card.dataset.jlpt = jlptLevel;

      const on_romaji  = toRomaji(readings_on);
      const kun_romaji = toRomaji(readings_kun);

      const jlptBadge   = jlptLevel ? `<span class="badge jlpt-n${jlptLevel}">JLPT ${jlptDisplay}</span>` : '';
      const gradeBadge  = grade   !== 'N/A' ? `<span class="badge">Grade ${grade}</span>` : '';
      const strokeBadge = strokes !== 'N/A' ? `<span class="badge">${strokes} strokes</span>` : '';
      const wkRow       = info && info.wk_level
        ? `<div class="detail-row"><span class="field-label">WK</span><span class="field-value">${info.wk_level}</span></div>` : '';

      card.innerHTML = `
        <div class="kanji-char">
          ${char}
          <button class="speech-button" data-char="${char}" ${!japaneseVoice ? 'disabled' : ''}
            title="Pronounce ${char}" aria-label="Pronounce ${char}">🔊</button>
        </div>
        <div class="card-badges">${jlptBadge}${gradeBadge}${strokeBadge}</div>
        <div class="kanji-details">
          <div class="detail-row">
            <span class="field-label">Meaning</span>
            <span class="field-value">${meanings}</span>
          </div>
          <div class="detail-row">
            <span class="field-label">On</span>
            <span class="field-value">${readings_on}${on_romaji ? ` <span class="romaji">(${on_romaji})</span>` : ''}</span>
          </div>
          <div class="detail-row">
            <span class="field-label">Kun</span>
            <span class="field-value">${readings_kun}${kun_romaji ? ` <span class="romaji">(${kun_romaji})</span>` : ''}</span>
          </div>
          ${wkRow}
        </div>
        <button class="learned-btn ${isLearned ? 'is-learned' : ''}" data-char="${char}">
          ${isLearned ? '✓ Unmark as Learned' : '＋ Mark as Learned'}
        </button>
      `;
      fragment.appendChild(card);
    });

    kanjiListContainer.innerHTML = '';
    kanjiListContainer.appendChild(fragment);
    renderPaginationControls(total);
    attachLearnedButtonListeners();
    attachSpeechButtonListeners();
    checkVoiceSupport();
  }

  /* ---- Learned button listeners (preserved exactly) ---- */
  function attachLearnedButtonListeners() {
    document.querySelectorAll(".learned-btn").forEach(btn => {
      const newBtn = btn.cloneNode(true);
      btn.parentNode.replaceChild(newBtn, btn);
      newBtn.addEventListener("click", (e) => {
        if (e.target.disabled) return;
        const char  = e.target.dataset.char;
        const index = learnedKanji.indexOf(char);
        if (index === -1) { learnedKanji.push(char); }
        else              { learnedKanji.splice(index, 1); }
        localStorage.setItem("learnedKanji", JSON.stringify(learnedKanji));
        const isNowLearned = index === -1;
        newBtn.classList.toggle("is-learned", isNowLearned);
        newBtn.textContent = isNowLearned ? "✓ Unmark as Learned" : "＋ Mark as Learned";
        const card = newBtn.closest('.kanji-card');
        if (card) card.classList.toggle('is-learned-card', isNowLearned);
        if (currentFilter === "learned") { currentPage = 1; renderKanji(); }
        updateJLPTCounts();
      });
    });
  }

  /* ---- Speech button listeners (preserved exactly) ---- */
  function attachSpeechButtonListeners() {
    document.querySelectorAll(".speech-button").forEach(btn => {
      const newBtn = btn.cloneNode(true);
      btn.parentNode.replaceChild(newBtn, btn);
      newBtn.addEventListener("click", (e) => {
        if (!japaneseVoice || !synthesizer || e.target.disabled) return;
        speakKanji(e.target.dataset.char);
      });
    });
  }

  /* ---- Speech synth (preserved exactly) ---- */
  function speakKanji(kanjiChar) {
    if (!japaneseVoice || !synthesizer) return;
    if (synthesizer.speaking) synthesizer.cancel();
    const utterance   = new SpeechSynthesisUtterance(kanjiChar);
    utterance.lang    = 'ja-JP';
    utterance.voice   = japaneseVoice;
    utterance.rate    = 0.8;
    utterance.pitch   = 1;
    synthesizer.speak(utterance);
  }

  /* ---- Pagination (logic preserved; button labels upgraded) ---- */
  function renderPaginationControls(totalItems) {
    paginationControlsEl.innerHTML = '';
    const totalPages = Math.ceil(totalItems / itemsPerPage);
    if (totalPages <= 1) return;

    if (currentPage > 1) {
      const btn = document.createElement('button');
      btn.textContent = '← Previous';
      btn.addEventListener('click', () => {
        currentPage--;
        renderKanji();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
      paginationControlsEl.appendChild(btn);
    }

    const info = document.createElement('span');
    info.className = 'page-info';
    info.textContent = `Page ${currentPage} of ${totalPages}`;
    paginationControlsEl.appendChild(info);

    if (currentPage < totalPages) {
      const btn = document.createElement('button');
      btn.textContent = 'Next →';
      btn.addEventListener('click', () => {
        currentPage++;
        renderKanji();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
      paginationControlsEl.appendChild(btn);
    }
  }

  /* ---- JLPT counts (preserved exactly) ---- */
  function updateJLPTCounts() {
    const dataForCounting   = allKanjiData;
    const counts            = { n1:0, n2:0, n3:0, n4:0, n5:0, other:0 };
    let totalInDataset      = 0;
    const currentLearnedCount = learnedKanji.length;

    if (dataForCounting && Object.keys(dataForCounting).length > 0) {
      for (const char in dataForCounting) {
        if (dataForCounting.hasOwnProperty(char)) {
          totalInDataset++;
          const jlptLevel = dataForCounting[char].jlpt_new || dataForCounting[char].jlpt_old;
          if      (jlptLevel === 1) counts.n1++;
          else if (jlptLevel === 2) counts.n2++;
          else if (jlptLevel === 3) counts.n3++;
          else if (jlptLevel === 4) counts.n4++;
          else if (jlptLevel === 5) counts.n5++;
          else counts.other++;
        }
      }
      jlptCountsEl.innerHTML =
        `Total: ${totalInDataset} &nbsp;|&nbsp; ` +
        `N5: ${counts.n5} &nbsp;|&nbsp; N4: ${counts.n4} &nbsp;|&nbsp; ` +
        `N3: ${counts.n3} &nbsp;|&nbsp; N2: ${counts.n2} &nbsp;|&nbsp; N1: ${counts.n1} ` +
        `&nbsp;|&nbsp; Learned: <span id="learned-count">${currentLearnedCount}</span>`;
    } else {
      jlptCountsEl.innerHTML =
        `<span class="error-message">Counts unavailable (all_kanji.json missing)</span> ` +
        `&nbsp;— Learned: <span id="learned-count">${currentLearnedCount}</span>`;
    }
  }

  /* ---- Bootstrap (preserved exactly) ---- */
  document.addEventListener('DOMContentLoaded', async () => {
    infoBoxArea.innerHTML = `<div class="info-box"><strong>Tip:</strong> If Kanji don't load, serve the folder via a local web server (not file://).</div>`;
    checkVoiceSupport();

    filterButtons.forEach(btn => {
      btn.addEventListener('click', (e) => {
        if (e.target.disabled) return;
        loadAndDisplayKanji(e.target.dataset.level);
      });
    });

    let searchTimeout;
    searchInput.addEventListener('input', () => {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => { currentPage = 1; renderKanji(); }, 250);
    });

    allKanjiData = await fetchJsonFile('data/all_kanji.json', true);
    const learnedButton = document.querySelector('button[data-level="learned"]');
    if (!allKanjiData || Object.keys(allKanjiData).length === 0) {
      if (learnedButton) learnedButton.disabled = true;
    } else {
      if (learnedButton) learnedButton.disabled = false;
    }
    updateJLPTCounts();
    await loadAndDisplayKanji("all");
  });
  </script>
</body>
</html>
